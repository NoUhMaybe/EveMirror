name: development checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/*.lock
      - run: python -m pip install -r requirements/dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m ruff check apps packages scripts tests
      - run: python -m ruff format --check apps packages scripts tests
      - run: python -m pytest -q
      - run: python scripts/simulate.py
      - run: python scripts/simulate_voice.py
      - run: python scripts/simulate_presence.py
      - run: python scripts/export_protocol.py
      - run: python scripts/export_application.py
      - run: git diff --exit-code -- packages/protocol/schema.json packages/application/schema.json packages/application/voice.schema.json packages/application/browser.schema.json
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/*.lock
      - run: python -m pip install -r requirements/dev.lock
        working-directory: .
      - run: python -m pip install --no-deps -e .
        working-directory: .
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm run contracts:check
      - run: npm run format:check
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          EVE_TEST_PYTHON: ${{ env.pythonLocation }}/bin/python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-browser-artifacts
          path: apps/dashboard/test-results/
          if-no-files-found: ignore
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements/dev.lock
      - run: python -m pip install --no-deps -e .
      - run: docker build -f deploy/server/Dockerfile -t evemirror-ci:${{ github.sha }} .
      - run: python scripts/container_acceptance.py --image evemirror-ci:${{ github.sha }} --allow-isolated-containers
  arm64-wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check Linux ARM64 wheel availability without installing or running Pi code
        run: >-
          python -m pip download --only-binary=:all: --no-deps
          --platform manylinux2014_aarch64 --platform manylinux_2_27_aarch64
          --platform manylinux_2_28_aarch64 --platform manylinux_2_34_aarch64
          --python-version 311 --implementation cp --abi cp311
          --dest "${{ runner.temp }}/eve-arm64-wheels" -r requirements/voice-edge.lock
  linux-voice-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: python -m pip install -r requirements/voice-edge.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - name: Import speech libraries without models or audio capture
        run: python -c "import onnxruntime, openwakeword, soxr, sounddevice, serial; from apps.edge.voice.capture import WakeVAD; print('Linux speech imports passed; hardware and models untested')"
