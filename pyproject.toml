[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evemirror"
version = "0.5.0"
description = "Local-first distributed smart mirror foundation"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "websockets>=15,<18",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx==0.28.1",
  "openai>=2.54,<3", "anthropic>=0.125,<1", "mcp>=1.30,<2", "jsonschema>=4.26,<5",
  "tzdata>=2026.5",
]
edge = ["pyserial==3.5"]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "httpx==0.28.1", "ruff>=0.9,<1", "requests>=2.32,<3", "numpy==2.2.6", "soxr==1.1.0"]

voice-edge = ["numpy==2.2.6", "soxr==1.1.0", "sounddevice==0.5.6", "openwakeword==0.6.0", "onnxruntime==1.31.0", "scipy==1.15.3"]
voice-server = ["numpy==2.2.6", "faster-whisper==1.2.1", "piper-tts==1.8.0", "av==14.2.0"]

[project.scripts]
eve-edge = "apps.edge.runtime:main"

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]
exclude = ["apps.dashboard*"]
namespaces = false

[tool.setuptools.package-data]
"packages.protocol" = ["schema.json"]
"packages.application" = ["schema.json", "voice.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["apps/**/*.py", "packages/**/*.py", "tests/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
