[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evemirror"
version = "0.2.0"
description = "Local-first distributed smart mirror foundation"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "websockets>=15,<18",
]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
edge = ["pyserial==3.5"]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "httpx==0.28.1", "ruff>=0.9,<1", "requests>=2.32,<3"]

[project.scripts]
eve-edge = "apps.edge.runtime:main"

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]
exclude = ["apps.dashboard*"]
namespaces = false

[tool.setuptools.package-data]
"packages.protocol" = ["schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["apps/**/*.py", "packages/**/*.py", "tests/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
